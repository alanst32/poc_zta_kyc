" text-anchor="start">0.3 ms total</text><text x="24" y="155" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">Unmapped route</text><text x="24" y="169" font-size="10.5" fill="#898781" text-anchor="start">JWT + DynamoDB, no Cedar call</text><path d="M210,146 H213.3 Q213.3,146 213.3,146 V166 Q213.3,166 213.3,166 H210 Z" fill="#2a78d6"><title>Unmapped route · JWT verification: 0.3 ms (median)</title></path><path d="M215.3,146 H294 Q298,146 298,150 V162 Q298,166 294,166 H215.3 Z" fill="#eb6834"><title>Unmapped route · DynamoDB reads: 4.7 ms (median)</title></path><text x="306" y="160" font-size="11.5" fill="#0b0b0b" text-anchor="start">4.9 ms total</text><text x="24" y="195" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">Cross-tenant</text><text x="24" y="209" font-size="10.5" fill="#898781" text-anchor="start">full PEP, Cedar DENY</text><path d="M210,186 H213.3 Q213.3,186 213.3,186 V206 Q213.3,206 213.3,206 H210 Z" fill="#2a78d6"><title>Cross-tenant · JWT verification: 0.3 ms (median)</title></path><path d="M215.3,186 H303 Q303,186 303,186 V206 Q303,206 303,206 H215.3 Z" fill="#eb6834"><title>Cross-tenant · DynamoDB reads: 5.1 ms (median)</title></path><path d="M305,186 H457.7 Q461.7,186 461.7,190 V202 Q461.7,206 457.7,206 H305 Z" fill="#1baf7a"><title>Cross-tenant · Verified Permissions: 8.9 ms (median)</title></path><text x="469.7" y="200" font-size="11.5" fill="#0b0b0b" text-anchor="start">17.2 ms total</text><text x="24" y="235" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">Cedar forbid (P2)</text><text x="24" y="249" font-size="10.5" fill="#898781" text-anchor="start">full PEP, Cedar DENY</text><path d="M210,226 H213.3 Q213.3,226 213.3,226 V246 Q213.3,246 213.3,246 H210 Z" fill="#2a78d6"><title>Cedar forbid (P2) · JWT verification: 0.3 ms (median)</title></path><path d="M215.3,226 H304.8 Q304.8,226 304.8,226 V246 Q304.8,246 304.8,246 H215.3 Z" fill="#eb6834"><title>Cedar forbid (P2) · DynamoDB reads: 5.2 ms (median)</title></path><path d="M306.8,226 H455.9 Q459.9,226 459.9,230 V242 Q459.9,246 455.9,246 H306.8 Z" fill="#1baf7a"><title>Cedar forbid (P2) · Verified Permissions: 8.7 ms (median)</title></path><text x="467.9" y="240" font-size="11.5" fill="#0b0b0b" text-anchor="start">15.6 ms total</text><text x="24" y="275" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">ALLOW</text><text x="24" y="289" font-size="10.5" fill="#898781" text-anchor="start">full PEP + target Lambda</text><path d="M210,266 H213.3 Q213.3,266 213.3,266 V286 Q213.3,286 213.3,286 H210 Z" fill="#2a78d6"><title>ALLOW · JWT verification: 0.3 ms (median)</title></path><path d="M215.3,266 H318.9 Q318.9,266 318.9,266 V286 Q318.9,286 318.9,286 H215.3 Z" fill="#eb6834"><title>ALLOW · DynamoDB reads: 6 ms (median)</title></path><path d="M320.9,266 H478.8 Q482.8,266 482.8,270 V282 Q482.8,286 478.8,286 H320.9 Z" fill="#1baf7a"><title>ALLOW · Verified Permissions: 9.2 ms (median)</title></path><text x="490.8" y="280" font-size="11.5" fill="#0b0b0b" text-anchor="start">19.2 ms total</text>
<text x="24" y="352" font-size="10.5" fill="#898781" text-anchor="start">Steps are medians taken separately, so they need not sum exactly to the median total. Source:</text>
<text x="24" y="366" font-size="10.5" fill="#898781" text-anchor="start">latency-&lt;run&gt;-server.csv.</text>
