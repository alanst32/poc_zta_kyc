<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' role="img">
<title>Where the authoriser spends its time</title>
<desc>Forged token: JWT 0 ms, DynamoDB 0 ms, Verified Permissions 0 ms, total 0.3 ms; Unmapped route: JWT 0.3 ms, DynamoDB 4.7 ms, Verified Permissions 0 ms, total 4.9 ms; Cross-tenant: JWT 0.3 ms, DynamoDB 5.1 ms, Verified Permissions 8.9 ms, total 17.2 ms; Cedar forbid (P2): JWT 0.3 ms, DynamoDB 5.2 ms, Verified Permissions 8.7 ms, total 15.6 ms; ALLOW: JWT 0.3 ms, DynamoDB 6 ms, Verified Permissions 9.2 ms, total 19.2 ms</desc>
<rect width="760" height="380" fill="#fcfcfb"/>
<text x="24" y="32" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">Where the authoriser spends its time</text>
<text x="24" y="52" font-size="12" fill="#52514e" text-anchor="start">Median time per PEP step for each decision path. A path that stops early never pays for the later steps.</text>
