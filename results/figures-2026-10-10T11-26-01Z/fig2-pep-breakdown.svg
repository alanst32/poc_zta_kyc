<text x="24" y="32" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">Where the authoriser spends its time</text>
<text x="24" y="52" font-size="12" fill="#52514e" text-anchor="start">Median time per PEP step for each decision path. A path that stops early never pays for the later steps.</text>
